# Produção só recebe versões de releases estáveis publicadas (tag vX.Y.Z).
# Testes falhando = nenhuma imagem publicada.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validar tag e versão do package.json
        id: v
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $TAG fora do padrão vX.Y.Z"; exit 1; }
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$PKG" = "$VERSION" ] || { echo "package.json ($PKG) diferente da tag ($VERSION)"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e publicar imagem
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/saladfruiter-labsgo/casa-nova:${{ steps.v.outputs.version }}
            ghcr.io/saladfruiter-labsgo/casa-nova:sha-${{ github.sha }}
            ghcr.io/saladfruiter-labsgo/casa-nova:stable
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest publicado
        run: echo "ghcr.io/saladfruiter-labsgo/casa-nova:${{ steps.v.outputs.version }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
